x-ai-worker: &ai-worker
  image: sa-beef-ai-worker:local
  build:
    context: ./AIProblemResolution
  restart: unless-stopped
  init: true
  environment:
    RABBITMQ_URL: amqp://ai:ai-local-only@rabbitmq:5672/%2F
    AI_QUEUE_PREFIX: ai.resolution
    AI_SHARDS: "2"
    MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
    MONGO_DATABASE: ai_resolution_db
    OLLAMA_URL: http://ollama:11434
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b}
    AI_TIMEOUT: ${AI_TIMEOUT:-120}
    AI_ATTEMPTS: "3"
  depends_on:
    mongo-init:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy
    ollama-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: evidence_db
      POSTGRES_USER: evidence
      POSTGRES_PASSWORD: evidence-local-only
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence -d evidence_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-init:
    image: mongo:7.0
    entrypoint: ["mongosh", "mongodb://mongo:27017/?directConnection=true", "--quiet", "/init/mongo-init.js"]
    volumes:
      - ./database/mongo-init.js:/init/mongo-init.js:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.3.6-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:8080:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ai
      RABBITMQ_DEFAULT_PASS: ai-local-only
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b}
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec ollama pull "$$OLLAMA_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  ai-worker-0:
    <<: *ai-worker
    command: ["python", "worker.py", "--shard", "0"]

  ai-worker-1:
    <<: *ai-worker
    command: ["python", "worker.py", "--shard", "1"]

  evidence-service:
    image: sa-beef-evidence:local
    build:
      context: ./EvidenceAndArgumentSubmission
      target: service
    restart: unless-stopped
    environment:
      GRPC_BIND_ANY: "true"
      GRPC_PORT: "50051"
      RABBITMQ_URL: amqp://ai:ai-local-only@rabbitmq:5672/%2F
      AI_QUEUE_PREFIX: ai.resolution
      AI_SHARDS: "2"
      EVIDENCE_DB_CONNECTION: Host=postgres;Port=5432;Database=evidence_db;Username=evidence;Password=evidence-local-only
      Authentication__Jwt__Issuer: humanresolve.evidence-service
      Authentication__Jwt__Audience: humanresolve.clients
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-change-this-to-a-unique-32-character-secret}
      # Arguments may only be written to real disputes by the two people in them.
      BEEF_API_URL: http://beef-crud-service:3000
    ports:
      - "127.0.0.1:50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-worker-0:
        condition: service_started
      ai-worker-1:
        condition: service_started
      beef-crud-service:
        condition: service_started

  beef-crud-service:
    image: sa-beef-crud:local
    build:
      context: ./BeefResolverCrud
    restart: unless-stopped
    environment:
      PORT: "3000"
      BEEF_DB_PATH: /data/beef-resolver.db
      # Same key the evidence service signs login tokens with, so disputes belong to real accounts.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-development-only-change-this-to-a-unique-32-character-secret}
      JWT_ISSUER: humanresolve.evidence-service
      JWT_AUDIENCE: humanresolve.clients
      SEED_MOCK_DATA: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - beef-crud-data:/data

  ai-api:
    image: sa-beef-ai-worker:local
    build:
      context: ./AIProblemResolution
    restart: unless-stopped
    command: ["python", "api.py"]
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DATABASE: ai_resolution_db
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  web-gateway:
    image: sa-beef-web:local
    build:
      context: .
      dockerfile: WebGateway/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8081"
      GRPC_HOST: evidence-service
      GRPC_PORT: "50051"
      BEEF_API_URL: http://beef-crud-service:3000
      AI_API_URL: http://ai-api:8000
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - evidence-service
      - beef-crud-service
      - ai-api

  # Kong API Gateway (DB-less) in front of the REST and gRPC services.
  # Set KONG_PUBLIC_HOST to this machine's LAN IP (see `ipconfig`) so Kong Manager
  # can reach the Admin API from the browser. Ports bind to all interfaces so the
  # LAN IP works; set KONG_BIND=127.0.0.1 to keep Kong local-only.
  kong:
    image: kong:3.9
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:9080 http2
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_ADMIN_GUI_URL: http://${KONG_PUBLIC_HOST:-localhost}:8002
      KONG_ADMIN_GUI_API_URL: http://${KONG_PUBLIC_HOST:-localhost}:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "${KONG_BIND:-0.0.0.0}:8000:8000"   # REST proxy
      - "${KONG_BIND:-0.0.0.0}:9080:9080"   # gRPC proxy (HTTP/2)
      - "${KONG_BIND:-0.0.0.0}:8001:8001"   # Admin API
      - "${KONG_BIND:-0.0.0.0}:8002:8002"   # Kong Manager
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      - beef-crud-service
      - evidence-service
      - ai-api

  demo-client:
    profiles: ["tools"]
    build:
      context: ./EvidenceAndArgumentSubmission
      target: demo-client
    environment:
      GRPC_HOST: evidence-service
      GRPC_PORT: "50051"
      DEMO_DISPUTE_ID: ${DEMO_DISPUTE_ID:-}
    depends_on:
      evidence-service:
        condition: service_started

volumes:
  rabbitmq-data:
  ollama-data:
  postgres-data:
  mongo-data:
  beef-crud-data:
